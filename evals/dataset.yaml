# Dataset de avaliação do Mesa Certa
#
# Especificação: docs/SDD.md §11. Cada caso é um turno único, sem histórico.
#
# CAMPOS
#   id                   rag-*, tool-*, comp-*, neg-*, adv-*. Estável: o SDD referencia ids.
#   categoria            rag_cardapio | rag_politicas | disponibilidade | reserva |
#                        pratos_do_dia | composto | fora_da_base | adversarial
#   referencias          US e RN do PRD que o caso cobre
#   pergunta             mensagem do usuário
#   contexto_data        "agora" injetado no clock (America/Sao_Paulo)
#   tools_esperadas      conjunto exato de tools chamadas no turno (ordem e repetição ignoradas)
#   tools_alternativas   outros conjuntos também aceitos (opcional)
#   chunks_esperados     chunk_ids que devem aparecer na recuperação (hit@k e MRR)
#   deve_citar_fonte     resposta deve conter marcação "Fonte: arquivo.md › Seção"
#   deve_recusar         resposta deve declarar ausência de informação ou fora de escopo
#   termos_obrigatorios  todos devem aparecer; item em lista = basta um dos sinônimos
#   termos_proibidos     nenhum pode aparecer
#
# COMPARAÇÃO DE TERMOS
#   Substring, sem diferenciar maiúsculas e sem acentos (NFKD).
#   Termos proibidos são frases afirmativas, nunca palavras soltas: uma recusa correta
#   ("não posso conceder desconto") não pode ser reprovada por citar o assunto.
#
# CHUNK_ID
#   slug(t)  = remove acentos, minúsculas, sequências fora de [a-z0-9] viram "-", apara "-"
#   com H3   = "{arquivo}#{slug(H2)}>{slug(H3)}#{n}"
#   sem H3   = "{arquivo}#{slug(H2)}#{n}"
#   n        = índice da parte quando a seção é dividida por tamanho (0 se não divide)
#
# PRÉ-CONDIÇÕES DO SEED (requisito de src/mesa_certa/db/seed.py)
#   - Âncora fixa 2026-09-15 (terça). O seed não lê o relógio.
#   - Sáb 2026-09-19: mesas do mezanino M1 a M4 com reservas CONFIRMADA de 6 pessoas
#     às 19:30 (fim 21:30). Varanda e salão livres às 20:00.
#     Efeito: 6 pessoas às 20:00 indisponível; alternativas 21:30, 22:00 e 22:30.
#   - K7M2QP: CONFIRMADA, Bruna Alves, 2 pessoas, sáb 2026-09-26 20:00, varanda.
#   - W4X9HT: CANCELADA.
#   - Livres: sex 2026-09-18 19:00 para 2; qua 2026-09-16 a partir das 18:00 para 3;
#     mezanino no sáb 2026-09-26 às 20:00.
#   - Pratos do dia cadastrados de 2026-09-15 a 2026-09-28; nenhum em 2026-11-10.
#   - Nenhuma outra reserva do seed pode conflitar com os itens acima.
#   - O runner re-semeia o banco antes de cada caso (cancelamentos mutam estado).

